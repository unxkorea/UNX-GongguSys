<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>공동구매 제안</title>
  <link rel="stylesheet" href="style.css?v=20260624j">
</head>
<body>
  <div id="loading" class="state-msg">불러오는 중…</div>
  <div id="error" class="state-msg" style="display:none"></div>

  <main id="catalog" style="display:none">
    <header class="hero">
      <div class="brand-row">
        <span class="brand-mark">UNX</span>
        <span class="brand-label">공동구매 제품</span>
      </div>
      <h1 id="catalogTitle"></h1>
    </header>

    <div id="grid" class="product-grid"></div>

    <footer class="footer">
      <span id="footerNote"></span>
    </footer>
  </main>

  <!-- 상세 모달 -->
  <div id="modal" class="modal" style="display:none" aria-hidden="true">
    <div class="modal-backdrop" onclick="closeModal()"></div>
    <article class="modal-content" id="modalContent" role="dialog" aria-modal="true"></article>
  </div>

  <!-- [요청] 제품추천 공개 앱 분리 — 이 앱 자신의 상대경로(/api/catalog/:code)만 호출한다.
       메인 관리 시스템 도메인은 이 페이지(브라우저) 쪽에서 전혀 알지 못한다(서버가 대신 내부 API로 조회). -->
  <script src="catalog.js?v=20260917a"></script>
</body>
</html>
